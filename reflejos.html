<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reflejos</title><style>body{margin:0;background:#080912;color:#fff;font-family:Arial;text-align:center}#arena{position:relative;width:100vw;height:70vh;background:#101530;overflow:hidden}#orb{position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#ffd54f,#ff8c00);display:none;box-shadow:0 0 30px #ffd54f}button{padding:16px 28px;border-radius:14px;border:0;background:#ffd54f;font-weight:bold}</style></head><body><h1>⚡ Reflejos</h1><p>30 segundos | Toca la esfera.</p><h2 id=timer>30</h2><h2>Puntos: <span id=score>0</span></h2><div id=arena><div id=orb></div></div><button id=start>Comenzar</button><script>const o=orb,a=arena,s=score,t=timer;let sc=0,time=30,int;function move(){o.style.left=Math.random()*(a.clientWidth-70)+"px";o.style.top=Math.random()*(a.clientHeight-70)+"px"}o.onclick=()=>{sc++;s.textContent=sc;move()};start.onclick=()=>{start.style.display="none";sc=0;time=30;s.textContent=0;t.textContent=30;o.style.display="block";move();int=setInterval(()=>{time--;t.textContent=time;if(time<=0){clearInterval(int);o.style.display="none";let coins=+localStorage.getItem("coins")||100;coins+=sc*5;localStorage.setItem("coins",coins);alert("Fin. Puntos: "+sc+"\nGanaste "+(sc*5)+" monedas.");location.href="../index.html"}},1000)}</script></body></html>
